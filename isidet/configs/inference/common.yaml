# Mode-agnostic runtime defaults.
# Loaded by stream_handler.py on every start, regardless of mode.
# Mode-specific files (cpu.yaml / gpu.yaml) deep-merge on top of this.
# Operator-tunable per-site values live in webapp/isitec_*/settings.json
# (model picker, line position, camera URL, sorter UDP, ROI, auto_start).

inference:
  # Engine auto-discovery + dispatch order. _build_engine in stream_handler.py
  # picks an inferencer class by file extension; this list is informational
  # for documentation purposes (the actual dispatch is hard-coded).
  engine_priority: [tensorrt, openvino, onnx, pt, pth]

  # Detection postprocess defaults. Same on CPU and GPU because they're
  # numerical correctness knobs, not perf knobs.
  max_det: 300
  nms_iou: 0.7

  # ByteTrack track_buffer is FPS-independent — same value works on both.
  # match_thresh IS FPS-dependent so it's mode-specific (see cpu.yaml / gpu.yaml).
  bytetrack:
    track_buffer: 60       # tuned baseline. NB: the engine reads the TOP-LEVEL `bytetrack`
                           # (cpu/gpu.yaml), so this nested key is informational; runtime buffer
                           # is the ByteTrack default (60) — kept in sync here for clarity.

  # UDP publisher always-on; host/port live in settings.json (operator-tunable
  # per site). The publisher updates target live when settings.json changes.
  udp:
    enabled: true

  # Line-crossing trigger anchor.
  # 'leading_edge' (DEFAULT) = emit when the FRONT of the parcel crosses the line
  #   (the "début de l'objet"). This is what the Celio automaticien requires: the
  #   PLC's timing correlation expects the send at the leading edge, not later.
  #   Maps via _ANCHOR_MAP using line_orientation + belt_direction (e.g.
  #   horizontal + top_to_bottom → bottom edge = the front as the parcel descends).
  # 'center' = emit at the bbox centre (size-independent but fires later) — opt-in.
  trigger_anchor: leading_edge

  # Counting accuracy defaults (recall-focused).
  # Operator can override dedup_time_enabled / dedup_interval_ms / count_interpolate
  # via settings.json without touching this file.
  count_interpolate: true        # recall: frame-gap-tolerant crossing
  dedup_time_enabled: false      # recall: global time guard OFF (dropped distinct parcels)
  dedup_interval_ms: 300         # only used if dedup_time_enabled is turned back on

  annotation:
    line_thickness: 2
    label_padding: 4
